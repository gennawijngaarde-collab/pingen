name: Auto-Publish Scheduled Pins

on:
  schedule:
    # Every 5 minutes: (1) publishes every pin whose scheduled time has passed,
    # (2) generates the next autopilot pin of every enabled account.
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: auto-publish
  cancel-in-progress: false

permissions:
  # Lets the job request a GitHub OIDC token; the API verifies it is signed by
  # GitHub for this repository on `main`, so no shared secret is needed.
  id-token: write
  contents: read

jobs:
  publish-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Optional override: when a CRON_SECRET repository secret exists it is
      # used as-is (must match the Vercel CRON_SECRET). Otherwise OIDC.
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      ENDPOINT: https://www.pingenx.io/api/cron/publish-scheduled-pins
      OIDC_AUDIENCE: pingenx-cron
    steps:
      - name: Obtain API token
        id: auth
        run: |
          set -euo pipefail
          if [ -n "${CRON_SECRET}" ]; then
            token="${CRON_SECRET}"
            echo "Auth: repository secret"
          else
            token=$(curl -sS --max-time 20 \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}" | jq -r '.value // empty')
            if [ -z "${token}" ]; then
              echo "::error::Could not obtain a GitHub OIDC token (is 'permissions: id-token: write' set?)."
              exit 1
            fi
            echo "Auth: GitHub OIDC"
          fi
          echo "::add-mask::${token}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"

      - name: Publish due pins
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          response=$(curl -sS -w "\n%{http_code}" --max-time 90 -X POST \
            -H "Authorization: Bearer ${TOKEN}" "${ENDPOINT}")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "HTTP Status: $http_code"
          echo "Response: $body"
          if [ "$http_code" != "200" ]; then
            echo "::error::Publication failed (HTTP $http_code)"
            exit 1
          fi

      - name: Generate autopilot pins
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          response=$(curl -sS -w "\n%{http_code}" --max-time 90 -X POST \
            -H "Authorization: Bearer ${TOKEN}" "${ENDPOINT}?task=autopilot")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "HTTP Status: $http_code"
          echo "Response: $body"
          if [ "$http_code" != "200" ]; then
            echo "::error::Autopilot generation failed (HTTP $http_code)"
            exit 1
          fi
